openapi: 3.1.0
info:
  title: dAI control plane
  version: 0.1.0
  description: |
    Source of truth for both clients. The agent is Swift and the control plane
    TypeScript, so this schema is the only artifact they share and the only place
    a mismatch can be caught before deployment.

    Two surfaces with different auth and different availability requirements:
    /agent/v1 is mTLS, /admin/v1 is session plus pool-scoped RBAC.

    Both sit behind an optional network allowlist (DAI_AGENT_CIDRS,
    DAI_ADMIN_CIDRS), and nodes may additionally be pinned to the network they
    enrolled from. That is defence in depth and never a substitute for
    authentication: a caller from an allowed network with no credentials is
    still refused.

servers:
  - url: https://localhost:8443

tags:
  - name: agent
    description: Node-facing. Mutual TLS, client certificate identifies the node.
  - name: admin
    description: Human-facing. Session auth, pool-scoped role bindings.
  - name: serving
    description: |
      OpenAI-compatible. Application callers with API keys, routed to whichever
      node may take the request right now.

paths:
  /agent/v1/enroll:
    post:
      tags: [agent]
      summary: Request enrollment
      description: |
        A join token never grants trust by itself. The node lands in `pending`
        with its hardware fingerprint and receives no certificate until an admin
        approves it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '202':
          description: Enrollment pending approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/enroll/{nodeId}:
    get:
      tags: [agent]
      summary: Collect a certificate after approval
      description: |
        Cannot require mTLS: the node has no certificate yet, which is why it is
        calling. The enrollment token returned by `/enroll` stands in, and is
        cleared on collection because a credential that can be replayed is one
        that will be.
      security: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: x-enrollment-token
          in: header
          required: false
          description: |
            Not marked required on purpose. A missing credential should read as
            401 from the handler rather than 400 from the request validator: it
            is an authentication failure, not a malformed request.
          schema: { type: string }
      responses:
        '200':
          description: Approved; certificate issued
          content:
            application/json:
              schema:
                type: object
                required: [state, certPem]
                properties:
                  state: { type: string, enum: [active] }
                  certPem: { type: string }
                  serverCaPem:
                    type: string
                    nullable: true
                    description: |
                      The CA that signs the control plane's own TLS certificate.
                      This is what a node pins to verify the server; a node that
                      verifies nothing accepts work from anything that can reach
                      it on the network. Distinct from nodeCaPem, and confusing
                      the two produces a verification failure that reads like a
                      connectivity problem.
                  nodeCaPem:
                    type: string
                    description: |
                      The CA that signed this node's certificate. Informational:
                      the node does not need it to connect.
        '202':
          description: Still awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties: { state: { type: string, enum: [pending] } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/nodes/{nodeId}/revoke:
    post:
      tags: [admin]
      summary: Revoke a node certificate
      description: |
        Checked on every request rather than cached, so a stolen laptop stops
        being a fleet member immediately rather than at the next renewal.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/me:
    get:
      tags: [agent]
      summary: What this node is, including its tier
      responses:
        '200':
          description: The node's own record
          content:
            application/json:
              schema:
                type: object
                required: [id, hostname, tier, state]
                properties:
                  id: { type: string, format: uuid }
                  hostname: { type: string }
                  tier: { type: string, enum: [harvest, cluster] }
                  state: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/policy:
    get:
      tags: [agent]
      summary: Current presence policy for this node
      responses:
        '200':
          description: Policy table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/heartbeat:
    post:
      tags: [agent]
      summary: Report presence, health and capability samples
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '204': { description: Accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch:
    get:
      tags: [agent]
      summary: Hold open a reverse channel for interactive requests
      description: |
        The node dials out and parks here; the control plane pushes a request
        down the open connection. Outbound from the node, so no inbound firewall
        rules and no NAT traversal, which is what made pull the right choice for
        batch. Push from the scheduler, so routing takes milliseconds rather than
        a poll interval.

        Returns 204 on timeout rather than holding forever, so a node notices a
        control plane restart instead of waiting on a dead socket.
      responses:
        '200':
          description: A request to handle now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '204': { description: Nothing to do; reconnect }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch/{dispatchId}/cancelled:
    get:
      tags: [agent]
      summary: Has the caller given up on this request?
      description: |
        Polled by a node while it generates. Asked rather than pushed because
        the node is inside a generation loop with no open channel to receive
        anything, and a cancelled request otherwise occupies it to completion:
        330 seconds of work for an answer nobody would read, on a resource that
        serves one request at a time.
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Whether to stop
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch/{dispatchId}/result:
    post:
      tags: [agent]
      summary: Return a completion for a pushed request
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  additionalProperties: true
                  properties:
                    text: { type: string }
                    promptTokens: { type: integer }
                    completionTokens: { type: integer }
                error: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nobody was waiting. The dispatch timed out and the request has moved
            on, so this answer is discarded rather than resolving a stale caller.
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }

  /agent/v1/work:
    get:
      tags: [agent]
      summary: Lease a unit of work
      description: |
        `kinds` is what the node may run *right now* under its presence policy,
        not what it is capable of. GPU work is legal only in LOCKED and ABSENT;
        ANE work in all five states. Without this the agent fetches work it must
        immediately hand back.
      parameters:
        - name: kinds
          in: query
          required: true
          description: Work kinds the node may currently run
          # An array with explode false, which is the OpenAPI spelling of
          # "comma-separated". Declaring it as a plain string looked equivalent
          # and was not: the validator then treats the comma as a reserved
          # character and rejects the very example this parameter documented,
          # so asking for one kind worked and asking for two never could.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkKind' }
            example: [embed, generate]
      responses:
        '200':
          description: A leased unit, or a reason none was given
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkLease'
                  - $ref: '#/components/schemas/NoWork'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/work/{unitId}/result:
    post:
      tags: [agent]
      summary: Report completed items and hand back the remainder
      description: |
        A harvest agent yields between items, not between units, and returns what
        it did not reach. Without this a yield costs a whole batch.
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkResult' }
      responses:
        '200':
          description: Accepted; reports how many items were requeued
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Lease expired or held by another node; result rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/models:
    get:
      tags: [serving]
      summary: Models currently resident somewhere in the fleet
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string }
                        owned_by: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v0/models:
    get:
      tags: [serving]
      summary: Models in LM Studio's shape, including the context window
      description: |
        Served so tools written against LM Studio work unchanged. Scripts probe
        this path for `loaded_context_length` to size a client's context window,
        and asking people to patch their tooling to try a fleet is a good way to
        have nobody try it.
      responses:
        '200':
          description: Models this fleet can serve
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/messages:
    post:
      tags: [serving]
      summary: Anthropic-compatible messages endpoint
      description: |
        The same routing, policy caps and reverse channel as
        `/v1/chat/completions`; only the request and response shapes differ. It
        exists because the clients people actually use speak this shape, and a
        fleet nobody can point a tool at is a fleet nobody uses.

        `stream: true` is answered as a single text delta rather than
        incrementally. A completion is dispatched to a node as one unit so that
        a preemption has a bounded worst case, so there is nothing to stream as
        it is produced. The event sequence is real; the incremental display is
        not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model: { type: string }
                max_tokens: { type: integer, minimum: 1 }
                stream: { type: boolean }
                system: {}
                temperature: { type: number }
                top_p: { type: number }
                stop_sequences: { type: array, items: { type: string } }
                tools: { type: array, items: { type: object, additionalProperties: true } }
                tool_choice: { type: object, additionalProperties: true }
                metadata: { type: object, additionalProperties: true }
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string }
                      content: {}
      responses:
        '200':
          description: A completion, or an SSE stream when stream is true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema: { type: string }
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No node is serving the requested model
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: No node can serve this right now
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/chat/completions:
    post:
      tags: [serving]
      summary: OpenAI-compatible completion, routed to an available node
      description: |
        Routed by eligibility first, then model residency, then measured
        throughput for the workload class, then in-flight count.

        Returns **503** when no node can currently take the request. During
        working hours every harvest node has a user present and GPU work is
        forbidden, so that is the expected answer rather than an error, and a
        caller is better served by hearing it immediately than by a hang.

        `max_tokens` is capped by the answering node's presence policy. A single
        request has no seam to yield at, so bounding its length bounds how long a
        returning user waits for their machine back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items: { type: object, additionalProperties: true }
                max_tokens: { type: integer, minimum: 1 }
                stream:
                  type: boolean
                  description: Not supported; a completion is dispatched as one unit.
      responses:
        '200':
          description: Completion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
        '400':
          description: |
            Malformed request. Uses the OpenAI error shape rather than this
            API's, because the callers of this surface are OpenAI clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: No node can take this request right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }

  /admin/v1/nodes:
    get:
      tags: [admin]
      summary: List nodes
      responses:
        '200':
          description: Nodes visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/nodes/{nodeId}/approve:
    post:
      tags: [admin]
      summary: Approve a pending node and issue its certificate
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Node approved and certificate issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          description: |
            The stored CSR cannot be signed. The node stays pending rather than
            becoming a member without a usable identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/nodes/{nodeId}/pause:
    post:
      tags: [admin]
      summary: Pause a node
      description: |
        The owner of a machine may always pause it and no role overrides that.
        This is not a permission, it is a property of the node's owner. An
        operator who could force work onto someone's Mac makes the agent malware
        in that person's mental model.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                until: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Node paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/nodes/{nodeId}/resume:
    post:
      tags: [admin]
      summary: Lift an administrative pause
      description: |
        Does not affect a pause set by the machine's owner. That one is theirs
        and no role can lift it.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Node resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/fleet/summary:
    get:
      tags: [admin]
      summary: Fleet capacity now and over the last 24 hours
      description: |
        Split by GPU and ANE because they are not interchangeable: GPU work is
        confined to LOCKED and ABSENT while ANE work runs in every state. The
        overnight GPU swell as machines lock is the value proposition made
        visible; the flat ANE band underneath is daytime capacity.
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/nodes/{nodeId}/detail:
    get:
      tags: [admin]
      summary: Node detail, idle pattern, yields and activity log
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/pools:
    get:
      tags: [admin]
      summary: List pools
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pool' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/jobs:
    get:
      tags: [admin]
      summary: Recent jobs, with what they are and where they came from
      responses:
        '200':
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Submit a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/jobs/{jobId}/results:
    get:
      tags: [admin]
      summary: Completed results, in submission order
      description: |
        Paged by `position` rather than an offset, because requeued remainders
        slot in ahead of pending work and an offset would drift under them.
        `nextAfter` is null when the last page has been served.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of completed units
          content:
            application/json:
              schema:
                type: object
                required: [jobId, state, units]
                properties:
                  jobId: { type: string, format: uuid }
                  state: { type: string }
                  nextAfter: { type: integer, nullable: true }
                  units:
                    type: array
                    items:
                      type: object
                      properties:
                        unitId: { type: string, format: uuid }
                        position: { type: integer }
                        node: { type: string, nullable: true }
                        seconds: { type: number, nullable: true }
                        items: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/jobs/{jobId}:
    get:
      tags: [admin]
      summary: Job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Node client certificate, issued at enrollment approval
    session:
      type: apiKey
      in: header
      name: authorization
      description: Human session token

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted for this pool
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    WorkKind:
      type: string
      description: |
        embed runs on the ANE and is permitted in every presence state.
        generate and render are GPU work, permitted only in LOCKED and ABSENT.
      enum: [embed, generate, render]

    PresenceState:
      type: string
      enum: [ACTIVE, PASSIVE, IDLE, LOCKED, ABSENT]

    EnrollRequest:
      type: object
      required: [joinToken, hostname, chip, memoryGb, metalWorkingSetGb, osVersion, csrPem]
      description: |
        `machineId` is the hardware's IOPlatformUUID. Approving a node retires
        any earlier record for the same machine, so a reinstalled machine
        replaces its old entry rather than appearing twice.
      properties:
        joinToken: { type: string }
        hostname: { type: string }
        chip: { type: string, example: Apple M2 Max }
        memoryGb: { type: number }
        metalWorkingSetGb:
          type: number
          description: |
            Metal self-caps well below installed RAM (~81% on an M2 Max).
            Ceilings are fractions of this, never of installed memory.
        osVersion: { type: string }
        machineId: { type: string, nullable: true }
        csrPem:
          type: string
          description: |
            CSR for a keypair generated on-device in the Secure Enclave and
            marked non-exportable, so a copied certificate is useless without
            the hardware. Stored, not signed: signing happens at approval, so a
            leaked join token is a nuisance rather than a fleet compromise.

    EnrollResponse:
      type: object
      required: [nodeId, state, enrollmentToken]
      properties:
        nodeId: { type: string, format: uuid }
        state: { type: string, enum: [pending] }
        enrollmentToken:
          type: string
          description: |
            Single use. The only way back in before the node has an identity,
            so it is cleared once the certificate is collected.

    Heartbeat:
      type: object
      required: [presenceState]
      properties:
        models:
          type: array
          description: |
            What each model this node can serve accepts. Reported rather than
            configured centrally, so the advertised window cannot drift from the
            weights actually on disk.
          items:
            type: object
            required: [name, contextLength]
            properties:
              name: { type: string }
              contextLength: { type: integer }
        userPaused:
          type: boolean
          description: |
            The machine owner has paused this node locally. Reported, not
            requested: the control plane records it and refuses to dispatch
            work, and has no way to clear it. Only the person at the machine
            can.
        presenceState: { $ref: '#/components/schemas/PresenceState' }
        onAcPower: { type: boolean }
        thermalOk: { type: boolean }
        residentModels:
          type: object
          additionalProperties: { type: number }
          description: |
            Model hashes currently held in memory, hash -> resident GB. Routing
            prefers a node that already has the model: E4 puts load at 1-3s and
            paying that per request is the difference between a service and a
            curiosity.
        capabilitySamples:
          type: array
          description: |
            Throughput observed from completed work, never declared. Capability
            is workload-dependent: the same two machines differed 7.5% on a 1.5B
            model and 26.3% on a 7B, so this is a map per workload class rather
            than a scalar.
          items:
            type: object
            required: [workloadClass, itemsPerSecond]
            properties:
              workloadClass: { type: string }
              itemsPerSecond: { type: number }

    WorkLease:
      type: object
      required: [unitId, kind, items, leaseExpiresAt]
      properties:
        jobLabel: { type: string, nullable: true }
        jobSource: { type: string }
        unitId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash:
          type: string
          nullable: true
          description: |
            Content hash from the signed catalogue. A work unit carries data and
            references a model; it cannot name an interpreter, a path, or a
            command. That bounds the blast radius of a compromised control plane.
        items:
          type: array
          items: { type: object, additionalProperties: true }
        leaseExpiresAt: { type: string, format: date-time }

    NoWork:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [empty, none-of-these-kinds, node-paused, user-paused]
          description: |
            `node-paused` is administrative and an operator can lift it.
            `user-paused` is the machine owner's own pause and nobody else can.

    WorkResult:
      type: object
      required: [completed, seconds]
      properties:
        completed:
          type: array
          items: { type: object, additionalProperties: true }
        unfinished:
          type: array
          description: Items the agent did not reach; requeued at the head.
          items: { type: object, additionalProperties: true }
        seconds: { type: number }
        failed: { type: boolean, default: false }

    Node:
      type: object
      required: [id, hostname, tier, state]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        chip: { type: string }
        memoryGb: { type: number }
        metalWorkingSetGb: { type: number }
        tier: { type: string, enum: [harvest, cluster] }
        state:
          type: string
          enum: [pending, active, cordoned, paused, offline, superseded]
          description: |
            `superseded` means this record was replaced when the same physical
            machine enrolled again. Kept rather than deleted, because the
            certificate it holds was really issued.
        ownerUserId: { type: string, format: uuid, nullable: true }
        presenceState:
          # Null until the node's first heartbeat. A freshly enrolled node has
          # no presence yet, which is precisely the state the enrollment flow
          # produces.
          oneOf:
            - $ref: '#/components/schemas/PresenceState'
            - type: 'null'
        lastHeartbeat: { type: string, format: date-time, nullable: true }
        models:
          type: array
          description: |
            What each model this node can serve accepts. Reported rather than
            configured centrally, so the advertised window cannot drift from the
            weights actually on disk.
          items:
            type: object
            required: [name, contextLength]
            properties:
              name: { type: string }
              contextLength: { type: integer }
        userPaused:
          type: boolean
          description: |
            Paused by the person at the machine. Distinct from state=paused,
            which is administrative: this one no role can lift.
        userPausedAt: { type: string, format: date-time, nullable: true }
        capabilityProfiles:
          type: object
          additionalProperties: { type: number }

    Pool:
      type: object
      required: [id, name, tier, schedule, preempt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: string, enum: [harvest, cluster] }
        schedule: { type: string, enum: [independent-units, gang] }
        preempt: { type: string, enum: [on-user-activity, never] }
        priority: { type: integer }

    JobRequest:
      type: object
      required: [poolId, kind, items]
      properties:
        poolId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash: { type: string, nullable: true }
        batchSize: { type: integer, minimum: 1, default: 8 }
        label:
          type: string
          description: |
            What this work is, in words, for whoever sees it running. A fleet
            view that can say a machine is busy but not what with is not much of
            an answer to the person whose machine it is.
        source:
          type: string
          default: api
          description: |
            Where the work came from - `api`, `cli`, `test-harness`, `demo-seed`.
            Claimed by the submitter, unlike the recorded submitter identity,
            which comes from the authenticated session. It distinguishes honest
            traffic sources; it is not evidence against a dishonest one.

            Synthetic work must say so. Otherwise every capacity figure it
            produces is quietly overstated by somebody else's load test.
        items:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }

    Job:
      type: object
      required: [id, poolId, kind, state, counts]
      properties:
        id: { type: string, format: uuid }
        poolId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        label: { type: string, nullable: true }
        source: { type: string }
        submittedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [pending, running, complete, failed] }
        counts:
          type: object
          properties:
            pending: { type: integer }
            leased: { type: integer }
            done: { type: integer }
            failed: { type: integer }

    FleetSummary:
      type: object
      required: [nodes, eligibleForGpu, gpuCapacityGb, aneCapacityGb, series, queues]
      properties:
        nodes: { type: integer }
        eligibleForGpu: { type: integer }
        gpuCapacityGb: { type: number }
        aneCapacityGb: { type: number }
        series:
          type: array
          items:
            type: object
            required: [hour, gpuGb, aneGb]
            properties:
              hour: { type: string, format: date-time }
              gpuGb: { type: number }
              aneGb: { type: number }
        queues:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              state: { type: string }
              n: { type: integer }

    NodeDetail:
      type: object
      required: [id, hostname, state, headroomGb, idlePattern, yields7d, activity]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        chip: { type: string, nullable: true }
        memoryGb: { type: number, nullable: true }
        metalWorkingSetGb: { type: number, nullable: true }
        tier: { type: string }
        state: { type: string }
        ownerUserId: { type: string, nullable: true }
        presenceState: { type: string, nullable: true }
        onAcPower: { type: boolean, nullable: true }
        thermalOk: { type: boolean, nullable: true }
        lastHeartbeat: { type: string, nullable: true }
        capabilityProfiles: { type: object, additionalProperties: { type: number } }
        allowedCidrs: { type: string, nullable: true }
        headroomGb:
          type: number
          description: What is takeable right now under policy, not total memory.
        policy:
          nullable: true
          type: object
          additionalProperties: true
        idlePattern:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer }
              presence_state: { type: string }
              n: { type: integer }
        yields7d:
          type: integer
          description: |
            How often this node interrupted work in the last week. The early
            warning that a policy is too aggressive for this machine.
        activity:
          type: array
          items:
            type: object
            properties:
              at: { type: string }
              event: { type: string }
              detail: { type: object, additionalProperties: true }

    Dispatch:
      type: object
      required: [dispatchId, kind, body]
      properties:
        dispatchId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash: { type: string, nullable: true }
        body:
          type: object
          additionalProperties: true
          description: The request to run, already capped by the node's policy.

    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }

    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
        dai:
          type: object
          description: |
            Outside the OpenAI schema. A caller on a harvested fleet should be
            able to see which machine answered and whether policy shortened the
            request.
          properties:
            node: { type: string }
            presenceState: { type: string, nullable: true }
            seconds: { type: number }
            maxTokensApplied: { type: integer }
            cappedByPolicy: { type: boolean }

    Policy:
      type: object
      description: |
        Per presence state. Values are E2 measurements, not estimates.
        mem_frac is NOT a politeness dial: a 32 GB load disturbed a viewport
        less than an 8 GB one at identical duty. Footprint governs what fits,
        occupancy governs disturbance.
      additionalProperties:
        type: object
        required: [gpu, ane, qos, dutyMax, memFrac]
        properties:
          gpu: { type: boolean }
          ane: { type: boolean }
          qos: { type: string, enum: [background, standard] }
          dutyMax: { type: number, minimum: 0, maximum: 1 }
          memFrac: { type: number, minimum: 0, maximum: 1 }
          maxCompletionTokens:
            type: integer
            description: |
              Largest single completion this state permits. Bounds how long a
              returning user waits, since one request has no seam to yield at.

security:
  - mtls: []
  - session: []
