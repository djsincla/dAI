<!--
  Fleet view.

  Four views behind a sidebar rather than five panels on one scroll. The old
  page showed everything at equal weight and left the reader to work out whether
  anything was wrong, which is tolerable at four machines and useless at forty.
  Overview answers that question directly; the rest are there when somebody
  wants the detail behind it.

  No build step and no framework, so this runs anywhere the control plane runs
  and can be read without tooling. The API is the contract; this is one client
  of it and deliberately not the only possible one.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dAI fleet</title>
<script>
  // Inline and first, so a page opened at night has its colours before it
  // paints rather than after. Everything else about the theme lives in app.js.
  try {
    const t = localStorage.getItem('dai.theme')
    if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t)
  } catch (e) { /* private mode */ }
</script>
<link rel="stylesheet" href="app.css">

<div class="shell">
  <aside class="sidebar">
    <div class="brand">dAI <span class="sub">fleet</span></div>

    <nav class="views">
      <a href="#/overview" data-view="overview"><span class="ico">◐</span> Overview</a>
      <a href="#/machines" data-view="machines"><span class="ico">▤</span> Machines
        <span class="count" id="nav-machines"></span></a>
      <a href="#/models"   data-view="models"><span class="ico">◈</span> Models
        <span class="count" id="nav-models"></span></a>
      <a href="#/work"     data-view="work"><span class="ico">≡</span> Work
        <span class="count" id="nav-work"></span></a>
      <a href="#/deploy"   data-view="deploy"><span class="ico">⇪</span> Deployment
        <span class="count" id="nav-deploy"></span></a>
      <a href="#/logs"     data-view="logs"><span class="ico">▦</span> Logs</a>
      <a href="#/api"      data-view="api"><span class="ico">⌘</span> API</a>
    </nav>

    <div class="sidebar-foot">
      <div class="whoami">
        <span id="signed-in-as"></span>
        <button id="sign-out" class="link">Sign out</button>
      </div>
      <div class="theme" id="theme">
        <button data-theme="auto">Auto</button>
        <button data-theme="light">Light</button>
        <button data-theme="dark">Dark</button>
      </div>
      <div class="links">
        <a href="/docs" target="_blank" rel="noreferrer">reference</a>
        <a href="/openapi.yaml" target="_blank" rel="noreferrer">spec</a>
      </div>
      <div class="conn" id="conn"></div>
    </div>
  </aside>

  <main id="view"></main>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button id="drawer-close" aria-label="Close">&times;</button>
  </div>
  <div id="drawer-body"></div>
</div>

<!--
  Sign-in, which the console did not have. It authenticated with a user id used
  directly as a bearer token: an identifier that appears in API responses, the
  audit log and any screenshot, granting access that never expired and could not
  be revoked without deleting the person.
-->
<div id="gate" class="gate" hidden>
  <form id="login-form" class="gate-card" autocomplete="on">
    <h1>dAI <span class="sub">fleet</span></h1>
    <p class="gate-note">Sign in to manage the fleet.</p>
    <label>Username
      <input id="login-user" name="username" autocomplete="username" required>
    </label>
    <label>Password
      <input id="login-pass" name="password" type="password"
             autocomplete="current-password" required>
    </label>
    <p class="gate-error" id="login-error" hidden></p>
    <button type="submit" class="primary">Sign in</button>
  </form>

  <form id="change-form" class="gate-card" hidden autocomplete="on">
    <h1>Choose a password</h1>
    <p class="gate-note" id="change-why">
      This deployment is still using the password it shipped with. Change it
      before going any further.
    </p>
    <label>Current password
      <input id="change-current" name="currentPassword" type="password"
             autocomplete="current-password" required>
    </label>
    <label>New password
      <input id="change-new" name="newPassword" type="password"
             autocomplete="new-password" required minlength="10">
    </label>
    <label>New password again
      <input id="change-again" type="password" autocomplete="new-password" required>
    </label>
    <p class="gate-error" id="change-error" hidden></p>
    <button type="submit" class="primary">Change password</button>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
