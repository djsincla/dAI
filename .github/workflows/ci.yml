# What a pull request has to survive.
#
# Both jobs run on macOS, which is not the usual default and is not an accident.
# The control-plane suite is mostly portable TypeScript, but `packaging.test.ts`
# and `reload.test.ts` shell out to `plutil`, `pkgutil` and `launchctl` — they
# exist to check the artifact rather than the source, which is where every
# expensive packaging fault in this project has landed. Running them on Linux
# would mean skipping them, and a skipped artifact test is how those faults got
# through in the first place.
#
# The cost is that Postgres has to be installed rather than run as a service
# container, which macOS runners do not support. That is a couple of minutes and
# worth it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; nothing here needs the older answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  control-plane:
    name: control plane (905 tests, real Postgres)
    runs-on: macos-15
    timeout-minutes: 25
    env:
      # The suite refuses to use DATABASE_URL, deliberately: the variable that
      # points at real data must not be able to nominate itself as the thing to
      # drop. See control-plane/test/helpers.ts.
      #
      # Port 5433, not the Postgres default, because that is this project's
      # convention everywhere - docker-compose, backup.sh, the READMEs - and
      # backup.test.ts hardcodes it rather than reading this variable. The first
      # CI run used 5432 and those tests failed with connection refused while
      # the rest of the suite passed, which is the tell: one file reaching a
      # database the others could not.
      TEST_DATABASE_URL: postgres://dai:dai@localhost:5433/dai_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      # Our own cluster rather than `brew services`, so the port is ours to set.
      - name: Start Postgres on 5433
        run: |
          brew install postgresql@17
          export PATH="/opt/homebrew/opt/postgresql@17/bin:$PATH"
          initdb -D "$RUNNER_TEMP/pgdata" -U dai
          pg_ctl -D "$RUNNER_TEMP/pgdata" -o "-p 5433" -l "$RUNNER_TEMP/pg.log" start
          for i in $(seq 1 30); do
            pg_isready -p 5433 -q && break
            sleep 2
          done
          pg_isready -p 5433
          # helpers.ts and backup.test.ts each create and drop their own
          # database through a maintenance connection to /postgres, so the role
          # only has to exist and be allowed to create.
          # -U dai: initdb made dai the superuser, and psql would otherwise
          # connect as the OS user, which has no role here.
          psql -U dai -p 5433 -d postgres -c "ALTER USER dai WITH PASSWORD 'dai';"

      - name: Postgres log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pg.log" || true

      - run: npm ci
        working-directory: control-plane

      - run: npm run typecheck
        working-directory: control-plane

      - run: npm test
        working-directory: control-plane

  agent:
    name: agent (391 tests)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # macos-26, not macos-15. The agent uses CoreML and AppKit APIs whose
      # Sendable annotations arrived after Xcode 16.4, so on the older image
      # `MLComputePlan` fails strict concurrency and the build stops. That is a
      # real constraint on what this compiles against, not a CI quirk, and the
      # honest fix is to say which toolchain rather than to weaken the code
      # until an old SDK accepts it.
      - name: Toolchain
        run: swift --version && xcodebuild -version

      # Resolves github.com/djsincla/mlx-swift-examples at the revision
      # Package.resolved names. ForkPinTests then checks that revision is the
      # one NOTICE claims, so a bumped pin with a stale notice fails here.
      - name: Resolve dependencies
        run: swift package resolve
        working-directory: agent

      - run: swift build
        working-directory: agent

      # MLX tests that need compiled Metal shaders skip themselves under
      # `swift test`: SwiftPM cannot build them, and the bundle comes from
      # xcodebuild. That is a real gap in this job and is documented in
      # agent/README.md rather than hidden by it.
      - run: swift test
        working-directory: agent
