openapi: 3.1.0
info:
  title: dAI control plane
  version: 0.1.0
  description: |
    Source of truth for both clients. The agent is Swift and the control plane
    TypeScript, so this schema is the only artifact they share and the only place
    a mismatch can be caught before deployment.

    Two surfaces with different auth and different availability requirements:
    /agent/v1 is mTLS, /admin/v1 is session plus pool-scoped RBAC.

    Both sit behind an optional network allowlist (DAI_AGENT_CIDRS,
    DAI_ADMIN_CIDRS), and nodes may additionally be pinned to the network they
    enrolled from. That is defence in depth and never a substitute for
    authentication: a caller from an allowed network with no credentials is
    still refused.

servers:
  - url: https://localhost:8443

tags:
  - name: agent
    description: Node-facing. Mutual TLS, client certificate identifies the node.
  - name: admin
    description: Human-facing. Session auth, pool-scoped role bindings.
  - name: serving
    description: |
      OpenAI-compatible. Application callers with API keys, routed to whichever
      node may take the request right now.

paths:
  /agent/v1/enroll:
    post:
      tags: [agent]
      summary: Request enrollment
      description: |
        A join token never grants trust by itself. The node lands in `pending`
        with its hardware fingerprint and receives no certificate until an admin
        approves it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollRequest' }
      responses:
        '202':
          description: Enrollment pending approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/enroll/{nodeId}:
    get:
      tags: [agent]
      summary: Collect a certificate after approval
      description: |
        Cannot require mTLS: the node has no certificate yet, which is why it is
        calling. The enrollment token returned by `/enroll` stands in, and is
        cleared on collection because a credential that can be replayed is one
        that will be.
      security: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: x-enrollment-token
          in: header
          required: false
          description: |
            Not marked required on purpose. A missing credential should read as
            401 from the handler rather than 400 from the request validator: it
            is an authentication failure, not a malformed request.
          schema: { type: string }
      responses:
        '200':
          description: Approved; certificate issued
          content:
            application/json:
              schema:
                type: object
                required: [state, certPem]
                properties:
                  state: { type: string, enum: [active] }
                  certPem: { type: string }
                  serverCaPem:
                    type: string
                    nullable: true
                    description: |
                      The CA that signs the control plane's own TLS certificate.
                      This is what a node pins to verify the server; a node that
                      verifies nothing accepts work from anything that can reach
                      it on the network. Distinct from nodeCaPem, and confusing
                      the two produces a verification failure that reads like a
                      connectivity problem.
                  nodeCaPem:
                    type: string
                    description: |
                      The CA that signs node certificates. A node needs this to
                      verify *another node*, which happens when one machine
                      holds half a model and the machine holding the other half
                      connects to it. Kept distinct from serverCaPem so that
                      trusting a peer never widens what may pose as a control
                      plane.
        '202':
          description: Still awaiting approval
          content:
            application/json:
              schema:
                type: object
                properties: { state: { type: string, enum: [pending] } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/nodes/{nodeId}/tiers:
    put:
      tags: [admin]
      summary: Which kinds of work this machine is offered for
      description: |
        Plural, and a machine may be offered for both.

        This is a choice with a consequence rather than a label. Cluster
        membership means presence does not gate serving, so an interactive
        request can land on the machine while its owner is using it - that is
        what "never preempted" buys and what it costs. Batch work stays
        presence-gated either way, and the owner's own pause still overrides
        everything.

        A machine must be offered for at least one kind of work. One offered for
        nothing still runs, still heartbeats and never receives anything, which
        is indistinguishable from a broken agent.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers]
              properties:
                tiers:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [harvest, cluster] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/nodes/{nodeId}/renew:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      summary: Ask a node to renew its certificate
      description: >
        Asked rather than done, because it cannot be done from anywhere else.
        The Enclave key signs only inside the node's daemon, so running
        `dai-agent renew` over ssh fails with "unable to sign digest" even as
        root, and the daemon renews on its own only at two thirds of
        certificate life.


        202 rather than 204: the node has been asked, not renewed. The flag
        rides down on its next heartbeat and is cleared when the new
        certificate arrives.
      responses:
        '202':
          description: The node has been asked
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: { type: string }
                  asked: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/nodes/{nodeId}/revoke:
    post:
      tags: [admin]
      summary: Revoke a node certificate
      description: |
        Checked on every request rather than cached, so a stolen laptop stops
        being a fleet member immediately rather than at the next renewal.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /agent/v1/renew:
    post:
      tags: [agent]
      summary: Renew this node's certificate
      description: |
        Renewal is routine and needs no human. The node authenticates with the
        certificate it already holds, which proves possession of the key it was
        issued against, so there is nothing for an admin to decide that was not
        decided at approval.

        It exists because certificates are deliberately short-lived: a machine
        that leaves the building should stop being a fleet member on its own.
        Without renewal that expiry is indistinguishable from an outage, and
        the only remedy is re-enrolling every machine by hand once a month.

        A revoked or superseded node cannot renew. Expiry is checked before this
        handler runs, so a node that has already lapsed gets 401 and must
        re-enroll: renewal extends an identity, it does not resurrect one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csrPem]
              properties:
                csrPem:
                  type: string
                  description: |
                    Ordinarily built from the same Secure Enclave key, since
                    that key cannot leave the machine and has no reason to
                    change. A different key is accepted and recorded, because a
                    machine that has had to rebuild its Enclave key would
                    otherwise need a full re-enrollment.
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema:
                type: object
                required: [certPem, notAfter]
                properties:
                  certPem: { type: string }
                  notAfter: { type: string, format: date-time }
                  rekeyed:
                    type: boolean
                    description: |
                      Whether the CSR carried a different public key from the
                      certificate being replaced.
                  serverCaPem:
                    type: string
                    nullable: true
                    description: |
                      Returned so a node picks up a rotated server CA without
                      anybody visiting it.
                  nodeCaPem:
                    type: string
                    description: |
                      Returned for the same reason, and so that nodes enrolled
                      before peer connections existed acquire it on their next
                      renewal rather than needing to be re-enrolled.
        '400':
          description: The CSR could not be signed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/jobs/{jobId}/attachments:
    get:
      tags: [agent]
      summary: What a job needs on this machine
      description: |
        The manifest, not the bytes. A node compares it with what it already
        holds and fetches only the gaps, which is what makes the second frame of
        a job on the same machine nearly free.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The manifest
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  entry:
                    type: string
                    nullable: true
                    description: |
                      The file the adapter opens, from the job rather than from
                      the work unit.
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, sha256]
                      properties:
                        path: { type: string }
                        sha256: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        dataFlow: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/blobs/{sha256}:
    get:
      tags: [agent]
      summary: One piece of a job's content, by its hash
      description: |
        Served only while some live job references it, so the store cannot be
        enumerated by guessing hashes, and content whose last job has finished
        is already unreachable before the reaper deletes it.
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '200':
          description: The content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/scenes/{sceneId}:
    get:
      tags: [agent]
      summary: What a scene is made of, so a node can fetch it
      description: |
        The manifest, not the bytes. A node compares it with what it has on disk
        and fetches only what is missing, which is what makes a re-leased unit
        on a machine that already rendered part of the job nearly free.
      parameters:
        - name: sceneId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The scene manifest
          content:
            application/json:
              schema:
                type: object
                required: [id, entry, files]
                properties:
                  id: { type: string }
                  entry:
                    type: string
                    description: |
                      The file the renderer opens. Comes from the catalogue and
                      never from a work unit: this is the one string from a
                      scene that reaches a command line.
                  sizeBytes: { type: integer, format: int64 }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, sizeBytes, sha256]
                      properties:
                        path: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        sha256: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/scenes/{sceneId}/files/{filePath}:
    get:
      tags: [agent]
      summary: One file of a scene
      parameters:
        - name: sceneId
          in: path
          required: true
          schema: { type: string }
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/work/{unitId}/output/{name}:
    put:
      tags: [agent]
      summary: Hand back a rendered frame
      description: |
        The half of the work model that only rendering needed. An embed or a
        generate unit returns a number or some text, and the result column holds
        it. A render unit returns a picture, and a job whose output exists only
        on whichever machine happened to render it has not been done.

        Accepted only from the node currently holding the lease, and only for a
        name that unit is supposed to produce. Last write wins: a render unit is
        idempotent, so a requeued one legitimately produces a file that already
        exists, and refusing the second copy would fail a job for succeeding
        twice.
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [name, sizeBytes, sha256]
                properties:
                  name: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  sha256: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent/v1/me:
    get:
      tags: [agent]
      summary: What this node is, including its tier
      responses:
        '200':
          description: The node's own record
          content:
            application/json:
              schema:
                type: object
                required: [id, hostname, tier, state]
                properties:
                  id: { type: string, format: uuid }
                  hostname: { type: string }
                  tier:
                    type: string
                    enum: [harvest, cluster]
                    description: |
                      Derived from `tiers`. An agent asks one question of it -
                      does presence gate me - and that answer is unchanged.
                  tiers:
                    type: array
                    items: { type: string, enum: [harvest, cluster] }
                  state: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/policy:
    get:
      tags: [agent]
      summary: Current presence policy for this node
      responses:
        '200':
          description: Policy table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/heartbeat:
    post:
      tags: [agent]
      summary: Report presence, health and capability samples
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Heartbeat' }
      responses:
        '200':
          description: >
            Accepted, and what the control plane wants from this node. Answered
            on the beat the node already sends, because there is no other way to
            reach a machine that dials out and never listens.
          content:
            application/json:
              schema:
                type: object
                required: [renewRequested]
                properties:
                  renewRequested:
                    type: boolean
                    description: >
                      Renew the certificate now rather than waiting for two
                      thirds of its life. The node must do this in-process: the
                      Enclave key signs only inside its daemon.
                  servingModel:
                    type: string
                    nullable: true
                    description: >
                      Which model this machine should be serving. It belongs to
                      the machine's group rather than to the machine: a node is
                      in at most one group per tier and any two groups sharing
                      it must name the same model, so there is one answer
                      however many groups it is in. Null means nobody has said,
                      which the node treats as "keep what you have" rather than
                      "stop serving" - a group that has not been given a model
                      is not an instruction to unload one.
                  keepLoaded:
                    type: boolean
                    description: >
                      Whether to hold the model in memory rather than loading it
                      when a request arrives. Intent, not tier: a node never
                      learns which groups it is in, and "hold this loaded" is an
                      instruction it can follow without knowing why.


                      True for a cluster group, because a split cannot begin
                      until every rank has built its share - a cold gang pays
                      the slowest machine's load before the first token, and
                      pays it again whenever the group falls idle. False for
                      harvest, where the machine belongs to whoever is sitting
                      at it.
                  machines:
                    type: integer
                    minimum: 1
                    description: >
                      How many machines this model runs across, as declared on
                      the model. Sent because a node cannot work it out and must
                      not guess.


                      Warming a model that runs across machines by loading the
                      whole thing is worse than not warming at all: it holds
                      roughly twice the memory the share needs, and the warm
                      copy is never used, because the split path builds its own
                      model with num_hidden_layers cut to this rank's range from
                      the same weights.
                  idleUnloadSeconds:
                    type: integer
                    nullable: true
                    minimum: 1
                    description: >
                      How long to hold the model after the last request, once
                      nothing is being asked of it. Null for a dedicated group,
                      which holds its model for as long as it stands.


                      The presence policy already covers "somebody wants their
                      machine back". Nothing covered "nobody wants anything", so
                      a harvest machine that answered one request held gigabytes
                      until its owner returned.


                      Not really a setting about weights: unloading clears the
                      prompt cache with them, and that is the expensive half.
                      Read it as how long to keep a conversation warm.
                  rank:
                    type: integer
                    minimum: 0
                    description: >
                      Which share of a split this machine holds, sent before
                      anything asks for it. Absent unless the model runs across
                      machines and the group can form a pipeline.


                      Rank 0 holds the last layers and the output head, and
                      listens; everything else dials it. Ranks are numbered in
                      reverse for that reason.


                      Rank is decided again at dispatch and that decision wins.
                      This is sent early so the share can be built beforehand -
                      a cold gang otherwise pays the slowest machine's load
                      before the first token. If a dispatch names a different
                      rank the machine rebuilds, because the share it warmed was
                      for a fleet that no longer exists.
                  size:
                    type: integer
                    minimum: 2
                    description: >
                      How many machines the pipeline has, sent with rank. Both
                      are needed to know which layers this machine owns.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch:
    get:
      tags: [agent]
      summary: Hold open a reverse channel for interactive requests
      description: |
        The node dials out and parks here; the control plane pushes a request
        down the open connection. Outbound from the node, so no inbound firewall
        rules and no NAT traversal, which is what made pull the right choice for
        batch. Push from the scheduler, so routing takes milliseconds rather than
        a poll interval.

        Returns 204 on timeout rather than holding forever, so a node notices a
        control plane restart instead of waiting on a dead socket.
      responses:
        '200':
          description: A request to handle now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispatch' }
        '204': { description: Nothing to do; reconnect }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch/{dispatchId}/cancelled:
    get:
      tags: [agent]
      summary: Has the caller given up on this request?
      description: |
        Polled by a node while it generates. Asked rather than pushed because
        the node is inside a generation loop with no open channel to receive
        anything, and a cancelled request otherwise occupies it to completion:
        330 seconds of work for an answer nobody would read, on a resource that
        serves one request at a time.
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Whether to stop
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/dispatch/{dispatchId}/result:
    post:
      tags: [agent]
      summary: Return a completion for a pushed request
      parameters:
        - name: dispatchId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  additionalProperties: true
                  properties:
                    text: { type: string }
                    promptTokens: { type: integer }
                    completionTokens: { type: integer }
                error: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Nobody was waiting. The dispatch timed out and the request has moved
            on, so this answer is discarded rather than resolving a stale caller.
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }

  /agent/v1/work:
    get:
      tags: [agent]
      summary: Lease a unit of work
      description: |
        `kinds` is what the node may run *right now* under its presence policy,
        not what it is capable of. GPU work is legal only in LOCKED and ABSENT;
        ANE work in all five states. Without this the agent fetches work it must
        immediately hand back.
      parameters:
        - name: kinds
          in: query
          required: true
          description: Work kinds the node may currently run
          # An array with explode false, which is the OpenAPI spelling of
          # "comma-separated". Declaring it as a plain string looked equivalent
          # and was not: the validator then treats the comma as a reserved
          # character and rejects the very example this parameter documented,
          # so asking for one kind worked and asking for two never could.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/WorkKind' }
            example: [embed, generate]
      responses:
        '200':
          description: A leased unit, or a reason none was given
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkLease'
                  - $ref: '#/components/schemas/NoWork'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agent/v1/work/{unitId}/result:
    post:
      tags: [agent]
      summary: Report completed items and hand back the remainder
      description: |
        A harvest agent yields between items, not between units, and returns what
        it did not reach. Without this a yield costs a whole batch.
      parameters:
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkResult' }
      responses:
        '200':
          description: Accepted; reports how many items were requeued
          content:
            application/json:
              schema:
                type: object
                required: [requeued]
                properties:
                  requeued: { type: integer, minimum: 0 }
                  jobFinished:
                    type: boolean
                    description: |
                      Whether that was the last unit of the job. Told to the
                      node so it can delete its own copy of the job's content
                      rather than waiting to be swept: the machine belongs to
                      somebody else, and tens of gigabytes of a finished job is
                      not the agent's to keep.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Lease expired or held by another node; result rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/models:
    get:
      tags: [serving]
      summary: Models currently resident somewhere in the fleet
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        object: { type: string }
                        owned_by: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v0/models:
    get:
      tags: [serving]
      summary: Models in LM Studio's shape, including the context window
      description: |
        Served so tools written against LM Studio work unchanged. Scripts probe
        this path for `loaded_context_length` to size a client's context window,
        and asking people to patch their tooling to try a fleet is a good way to
        have nobody try it.
      responses:
        '200':
          description: Models this fleet can serve
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/messages/count_tokens:
    post:
      tags: [serving]
      summary: How many tokens a request would cost
      description: |
        Counted by a node's own tokeniser and chat template rather than
        estimated centrally. Tools are included, since their schemas are
        rendered into the prompt and are frequently the larger half of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                system: {}
                tools: { type: array, items: { type: object, additionalProperties: true } }
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string }
                      content: {}
      responses:
        '200':
          description: The token count
          content:
            application/json:
              schema:
                type: object
                required: [input_tokens]
                properties:
                  input_tokens: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No node is serving the requested model
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: No node can serve this right now
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /v1/messages:
    post:
      tags: [serving]
      summary: Anthropic-compatible messages endpoint
      description: |
        The same routing, policy caps and reverse channel as
        `/v1/chat/completions`; only the request and response shapes differ. It
        exists because the clients people actually use speak this shape, and a
        fleet nobody can point a tool at is a fleet nobody uses.

        `stream: true` is answered as a single text delta rather than
        incrementally. A completion is dispatched to a node as one unit so that
        a preemption has a bounded worst case, so there is nothing to stream as
        it is produced. The event sequence is real; the incremental display is
        not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, max_tokens]
              properties:
                model: { type: string }
                max_tokens: { type: integer, minimum: 1 }
                stream: { type: boolean }
                system: {}
                temperature: { type: number }
                top_p: { type: number }
                stop_sequences: { type: array, items: { type: string } }
                tools: { type: array, items: { type: object, additionalProperties: true } }
                tool_choice: { type: object, additionalProperties: true }
                metadata: { type: object, additionalProperties: true }
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string }
                      content: {}
      responses:
        '200':
          description: A completion, or an SSE stream when stream is true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema: { type: string }
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No node is serving the requested model
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '503':
          description: No node can serve this right now
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /v1/chat/completions:
    post:
      tags: [serving]
      summary: OpenAI-compatible completion, routed to an available node
      description: |
        Routed by eligibility first, then model residency, then measured
        throughput for the workload class, then in-flight count.

        Returns **503** when no node can currently take the request. During
        working hours every harvest node has a user present and GPU work is
        forbidden, so that is the expected answer rather than an error, and a
        caller is better served by hearing it immediately than by a hang.

        `max_tokens` is capped by the answering node's presence policy. A single
        request has no seam to yield at, so bounding its length bounds how long a
        returning user waits for their machine back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items: { type: object, additionalProperties: true }
                max_tokens: { type: integer, minimum: 1 }
                stream:
                  type: boolean
                  description: Not supported; a completion is dispatched as one unit.
      responses:
        '200':
          description: Completion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
        '400':
          description: |
            Malformed request. Uses the OpenAI error shape rather than this
            API's, because the callers of this surface are OpenAI clients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: No node can take this request right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }

  /admin/v1/nodes:
    get:
      tags: [admin]
      summary: List nodes
      responses:
        '200':
          description: Nodes visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/nodes/{nodeId}/approve:
    post:
      tags: [admin]
      summary: Approve a pending node and issue its certificate
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Node approved and certificate issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '400':
          description: |
            The stored CSR cannot be signed. The node stays pending rather than
            becoming a member without a usable identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/nodes/{nodeId}/pause:
    post:
      tags: [admin]
      summary: Pause a node
      description: |
        The owner of a machine may always pause it and no role overrides that.
        This is not a permission, it is a property of the node's owner. An
        operator who could force work onto someone's Mac makes the agent malware
        in that person's mental model.
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                until: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Node paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/nodes/{nodeId}/resume:
    post:
      tags: [admin]
      summary: Lift an administrative pause
      description: |
        Does not affect a pause set by the machine's owner. That one is theirs
        and no role can lift it.
      parameters:
        - { name: nodeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Node resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/fleet/summary:
    get:
      parameters:
        - name: window
          in: query
          required: false
          description: >
            Seconds of history for the capacity series, between 600 and 259200.
            The bucket size is derived from it rather than given separately, so
            the two cannot disagree.
          schema: { type: integer, minimum: 600, maximum: 259200 }
      tags: [admin]
      summary: Fleet capacity now and over the last 24 hours
      description: |
        Split by GPU and ANE because they are not interchangeable: GPU work is
        confined to LOCKED and ABSENT while ANE work runs in every state. The
        overnight GPU swell as machines lock is the value proposition made
        visible; the flat ANE band underneath is daytime capacity.
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/nodes/{nodeId}/detail:
    get:
      tags: [admin]
      summary: Node detail, idle pattern, yields and activity log
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Node detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/auth/login:
    post:
      tags: [admin]
      summary: Exchange a username and password for a session token
      description: >
        The token is returned once and stored only as a hash, so it cannot be
        recovered from the database afterwards. A fresh deployment starts with
        admin and admin, and that account can do nothing until the password is
        changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time, nullable: true }
                  email: { type: string }
                  username: { type: string, nullable: true }
                  mustChangePassword: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/auth/logout:
    post:
      tags: [admin]
      summary: End this session
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/auth/me:
    get:
      tags: [admin]
      summary: Who this credential belongs to
      responses:
        '200':
          description: The signed-in account
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  username: { type: string, nullable: true }
                  kind: { type: string, enum: [session, api_key] }
                  mustChangePassword: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/auth/password:
    post:
      tags: [admin]
      summary: Change a password
      description: >
        The one route reachable while a password change is outstanding. Ends
        every other session, because a change that left them working would not
        lock anybody out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  otherSessionsEnded: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/auth/keys:
    get:
      tags: [admin]
      summary: API keys this account holds
      responses:
        '200':
          description: Keys, never including the secret
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    label: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    lastSeenAt: { type: string, format: date-time, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Mint an API key for a program
      description: >
        Long lived on purpose, because a tool pointed at the serving API cannot
        be asked to sign in. Returned once and never recoverable.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  label: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/auth/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Revoke one API key
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monitor/v1/health:
    get:
      tags: [monitor]
      summary: Whether the control plane can reach its database
      description: >
        No credential, restricted by address range, and disabled entirely when
        no range is configured. Distinct from /healthz, which only answers
        whether the process is running.
      responses:
        '200':
          description: Healthy
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Database unreachable
          content:
            text/plain:
              schema: { type: string }
        '403':
          description: Address not permitted
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Monitoring is disabled because no address range is configured
          content:
            text/plain:
              schema: { type: string }

  /monitor/v1/metrics:
    get:
      tags: [monitor]
      summary: Fleet metrics in Prometheus exposition format
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        '403':
          description: Address not permitted
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Monitoring is disabled because no address range is configured
          content:
            text/plain:
              schema: { type: string }

  /admin/v1/pools/{poolId}/nodes/{nodeId}:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: nodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Put a machine in a group by hand
      description: >
        A group is either a list somebody picked or a rule machines match, never
        both. Adding the first machine by hand converts a rule into a list,
        which changes who belongs, so it answers 409 until confirmed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean }
      responses:
        '204': { description: Added }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Would convert a rule into a list, or the tier forbids it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [admin]
      summary: Take a machine out of a group
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/pools:
    get:
      tags: [admin]
      summary: List pools
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pool' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                tier: { type: string, enum: [harvest, cluster] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  tier: { type: string }
                  servingPort:
                    type: integer
                    description: >
                      The socket this group now answers on, bound before this
                      response was sent. Returned rather than left to be looked
                      up, because the next thing somebody does with a new group
                      is point something at it.
        '409':
          description: >
            A group with that name exists, or every socket in the range is
            taken. The second is not a naming problem and says so: a group that
            cannot be addressed is not created at all, since one that existed
            and refused connections would be worse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /agent/v1/agent/desired:
    get:
      tags: [agent]
      summary: The agent build this node should be running
      description: >
        Empty when the node's pools are external, meaning an MDM or a person
        owns the binary and this system only observes. A node told nothing does
        nothing.
      responses:
        '200':
          description: The desired build, or an empty object
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  sha256: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  notes: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/agent/builds/{version}/binary:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agent]
      summary: Fetch an agent binary
      responses:
        '200':
          description: The binary
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/agent/upgrades:
    post:
      tags: [agent]
      summary: Report what an upgrade did, including a self-rollback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toVersion, state]
              properties:
                fromVersion: { type: string, nullable: true }
                toVersion: { type: string }
                state: { type: string, enum: [started, committed, reverted, failed] }
                detail: { type: string, nullable: true }
      responses:
        '204': { description: Recorded }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/models/assigned:
    get:
      tags: [agent]
      summary: What this node is supposed to be holding
      description: >
        Resolved through pool membership, so a node learns what to fetch without
        being told which pools it is in. Returns file hashes, which is what the
        node verifies against before it will load anything.
      responses:
        '200':
          description: Assigned models with their files
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, runtime, kind, files]
                  properties:
                    id: { type: string }
                    runtime: { type: string, enum: [mlx, coreml] }
                    kind: { $ref: '#/components/schemas/WorkKind' }
                    files:
                      type: array
                      items: { $ref: '#/components/schemas/ModelFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /agent/v1/models/{modelId}/files/{filePath}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema: { type: string }
      - name: filePath
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agent]
      summary: Fetch one file of a model
      description: >
        Range requests are supported because a shard is gigabytes and a transfer
        that cannot resume starts again from zero every time a machine sleeps.
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206': { description: Partial content }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/models/available:
    get:
      tags: [admin]
      summary: Models that could be added, and what adding them would cost
      description: >
        Deliberately a shortlist rather than a mirror of a public hub. Models
        already on this machine's disk are offered first, because importing one
        costs nothing and downloading one costs the building's uplink.
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, source, registered]
                  properties:
                    id: { type: string }
                    source:
                      type: string
                      enum: [local, remote]
                      description: >
                        local means the files are already on this machine and
                        importing is a copy. remote means it has to be fetched.
                    path: { type: string, nullable: true }
                    sizeBytes: { type: integer, format: int64, nullable: true }
                    kind: { $ref: '#/components/schemas/WorkKind' }
                    contextLength: { type: integer, nullable: true }
                    family: { type: string, nullable: true }
                    note: { type: string, nullable: true }
                    registered: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/models/imports:
    get:
      tags: [admin]
      summary: Imports running now, and recent failures
      description: >
        Successful imports drop off this list because the model itself is the
        record of those. A failure has no other trace, and one that leaves none
        is indistinguishable from an import nobody started.
      responses:
        '200':
          description: Imports
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, modelId, state]
                  properties:
                    id: { type: string, format: uuid }
                    modelId: { type: string }
                    state: { type: string, enum: [running, done, failed] }
                    filesDone: { type: integer }
                    filesTotal: { type: integer }
                    bytesDone: { type: integer, format: int64 }
                    error: { type: string, nullable: true }
                    startedAt: { type: string, format: date-time }
                    finishedAt: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/models/import:
    post:
      tags: [admin]
      summary: Import a model that is already on this machine
      description: >
        Hashes every file, copies it into the repository, and registers it. The
        hashing is the point: it is what lets a node tell a complete copy from
        one that stopped on a block boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                path: { type: string, nullable: true }
      responses:
        '202':
          description: Import started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  state: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/agent/builds:
    get:
      tags: [admin]
      summary: Agent builds, and how many machines run each
      responses:
        '200':
          description: Builds and what is running
          content:
            application/json:
              schema:
                type: object
                required: [builds, running]
                properties:
                  builds:
                    type: array
                    items:
                      type: object
                      required: [version, sha256, sizeBytes]
                      properties:
                        version: { type: string }
                        sha256: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        notes: { type: string, nullable: true }
                        uploadedAt: { type: string, format: date-time }
                        uploadedBy: { type: string, nullable: true }
                        nodesRunning: { type: integer }
                  running:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: string }
                        fingerprint: { type: string, nullable: true }
                        nodes: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Register an agent build from a file on the control plane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, path]
              properties:
                version: { type: string, minLength: 1 }
                path: { type: string }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  sha256: { type: string }
                  sizeBytes: { type: integer, format: int64 }
                  notes: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/agent/rollout:
    get:
      tags: [admin]
      summary: What every machine runs, what it should run, and who decides
      responses:
        '200':
          description: Per machine
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [nodeId, hostname, running, channel]
                  properties:
                    nodeId: { type: string, format: uuid }
                    hostname: { type: string }
                    running: { type: string }
                    fingerprint: { type: string, nullable: true }
                    desired: { type: string, nullable: true }
                    channel: { type: string, enum: [managed, external] }
                    upToDate: { type: boolean, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/agent/upgrades:
    get:
      tags: [admin]
      summary: Upgrades attempted, and how they ended
      responses:
        '200':
          description: Recent attempts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    at: { type: string, format: date-time }
                    hostname: { type: string }
                    fromVersion: { type: string, nullable: true }
                    toVersion: { type: string }
                    state: { type: string, enum: [started, committed, reverted, failed] }
                    detail: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/pools/{poolId}/serving-model:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: What this group's machines run
      description: >
        Distinct from pushing a model to a group, which says what its machines
        should hold. A machine holds many models and loads one, so this is the
        only part two groups sharing a machine may not disagree about.


        409 when they would. The reply names the machine, because the coupling
        is transitive and the group it names may not be one the caller was
        thinking about.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modelId:
                  type: string
                  nullable: true
                  description: Null clears it, which is not the same as none.
      responses:
        '204': { description: Set }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A machine's groups would disagree about what it runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  detail: { type: string }
                  violations:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: string
                          enum: [one-group-per-tier, groups-must-agree]
                        detail: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/pools/{poolId}/idle-unload:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: How long this group's machines keep a model when nothing is asking
      description: >
        The presence policy already covers "somebody wants their machine back".
        This covers "nobody wants anything", which nothing did: a machine that
        answered one request held gigabytes until its owner returned.


        Not really a setting about weights. Unloading clears the prompt cache
        with them and that is the expensive half - a loop that released too
        eagerly once turned a 0.5s warm request into 37.5s. Read it as how long
        to keep a conversation warm.


        Null restores the fleet default. Meaningless on a cluster group, which
        is dedicated and holds its model for as long as it stands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  nullable: true
                  minimum: 1
      responses:
        '200':
          description: What the group will now do
          content:
            application/json:
              schema:
                type: object
                properties:
                  idleUnloadSeconds: { type: integer, nullable: true }
        '400':
          description: Not a whole number of seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/v1/pools/{poolId}/serve:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Tell a group to serve a model, and how wide
      description: >
        Three writes in an order that matters: declare the width on the model,
        make sure the group holds the weights, then set what it serves.


        The width first, because a group cannot be given a model that runs
        across machines before the model says it does - and the refusal for the
        other order names a rule rather than an order, which reads as a fault.


        Holding is separate from serving: pools.serving_model_id decides what a
        group's machines run, pool_models decides what they fetch. Setting only
        the first leaves a group waiting forever with nothing fetching anything.


        machines 1 is a dedicated group holding a whole model - the same three
        writes, and the only difference is that nobody dials anybody.


        Not a transaction. The order is chosen so half-states are inert - a
        width nobody serves is a number, weights nobody serves is a download -
        and it is idempotent, so running it again finishes it.


        A null modelId unpins the group instead: it goes on holding everything
        it was staged with and serves whichever of those a caller asks for,
        loading at dispatch. Nothing is fetched or deleted - only the pin is
        removed - so pinning it again to any staged model costs nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId:
                  type: string
                  nullable: true
                  description: >
                    The model to pin this group to, or null to serve whichever
                    staged model is asked for.
                machines:
                  type: integer
                  minimum: 1
                  default: 1
                  description: How many machines it runs across.
                confirm:
                  type: boolean
                  description: >
                    Acknowledge the cost. Serving a split takes its machines out
                    of harvesting for as long as it stands, which is a decision
                    rather than a side effect.
      responses:
        '200':
          description: What the group will now serve
          content:
            application/json:
              schema:
                type: object
                properties:
                  group: { type: string }
                  modelId: { type: string, nullable: true }
                  machines: { type: integer }
                  perMachineGb: { type: number }
                  machinesInGroup: { type: integer }
                  serves:
                    type: array
                    description: >
                      What an unpinned group can now be asked for. Absent when
                      the group is pinned to one model.
                    items: { type: string }
        '400':
          description: No model named
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such group, or no such model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >
            The group cannot run it at that width, or the cost needs
            acknowledging.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/v1/pools/{poolId}/readiness:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Whether this group could serve a request right now
      description: >
        Asked before anybody sends anything. Standing a split up meant enabling
        the group and then waiting with nothing to look at while the weights
        arrived, and the first sign it was not ready came from sending a request
        and reading the refusal - a diagnostic disguised as a failure, minutes
        after an operator could have acted on it.


        The same questions the router asks at admission, in the same order, so a
        group reported ready here is admitted there.
      responses:
        '200':
          description: What the group can do, and what is missing
          content:
            application/json:
              schema:
                type: object
                required: [group, tier, state, detail, machines, present, ranks]
                properties:
                  group: { type: string }
                  tier: { type: string }
                  state:
                    type: string
                    enum: [ready, preparing, blocked, idle]
                    description: >
                      preparing resolves on its own; blocked needs somebody to
                      act. Saying which is the difference between waiting and
                      walking to a machine.
                  detail: { type: string }
                  model: { type: string, nullable: true }
                  machines:
                    type: integer
                    description: How many machines the model was declared to need.
                  present:
                    type: integer
                    description: How many are here and could take a rank.
                  ranks:
                    type: array
                    items:
                      type: object
                      required: [hostname, state, detail, weights, loaded, dialable]
                      properties:
                        hostname: { type: string }
                        rank:
                          type: integer
                          nullable: true
                          description: >
                            Null until ranks can be assigned, which needs at
                            least one machine that can be dialled.
                        role:
                          type: string
                          nullable: true
                          enum: ['output head', 'feeds the next rank', null]
                        state:
                          type: string
                          enum: [ready, loading, fetching, unreachable, faulted]
                        detail: { type: string }
                        weights: { type: string, enum: [present, missing] }
                        loaded: { type: boolean }
                        dialable:
                          type: boolean
                          description: >
                            Whether it has said where a peer should dial it. The
                            one that is nearly always a cable.
        '404':
          description: No such group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/v1/pools/{poolId}/coupled:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Groups forced to agree with this one
      description: >
        Agreement spreads through shared machines, so a group can be constrained
        by one it shares nothing with.
      responses:
        '200':
          description: The coupled groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    tier: { type: string }
                    servingModelId: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/pools/{poolId}:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [admin]
      summary: Delete a group
      description: >
        Everything scoped to the group goes with it: its jobs and their work
        units, which models it was pushing, and every role anybody holds on it.
        Its machines are freed, because membership lives on the group's own row.

        Refused without `confirm=true`, with a sentence naming what would be
        lost - none of it comes back, and standing the group down is the
        reversible way to take its machines back.

        The group's socket is retired rather than freed: a client left pointing
        at the old URL would otherwise start talking to a different group's
        machines without anything having changed at its end.
      parameters:
        - name: confirm
          in: query
          schema: { type: string, enum: ['true'] }
          description: Required. Without it the request is refused and nothing is deleted.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  frees:
                    type: array
                    items: { type: string }
                    description: Machines that are no longer in any group because of this.
                  retiredPort: { type: integer, nullable: true }
        '409':
          description: Not confirmed, and nothing was deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/pools/{poolId}/enabled:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Stand a group down, or bring it back
      description: >
        A disabled group keeps everything it was configured with and asserts
        none of it: it decides nothing about what its machines serve, suspends
        nobody from another group, hands out no work, and refuses on its own
        socket. Its machines, its model and its port are all still there.

        That is the difference from deleting it. A cluster group overrides the
        harvest group it shares machines with, so the way to hand those machines
        back - and let the harvest group's own model take effect - is to stand
        the cluster group down, not to dismantle it and rebuild it from memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: >
            The new state, and which machines it affects. What those machines
            serve next is usually the reason somebody pressed this, so it is
            answered rather than left to be noticed.
          content:
            application/json:
              schema:
                type: object
                required: [name, enabled, machines]
                properties:
                  name: { type: string }
                  enabled: { type: boolean }
                  machines:
                    type: array
                    items:
                      type: object
                      properties:
                        hostname: { type: string }
                        nowServes:
                          type: string
                          nullable: true
                          description: >
                            What this machine will take up now, given every
                            group that is still asserting something. Null means
                            nothing is deciding, which is not an instruction to
                            unload.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/pools/{poolId}/socket:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Give a group a socket of its own
      description: >
        For groups that predate per-group sockets. The schema deliberately does
        not backfill them, because binding listeners nobody asked for during an
        upgrade is how a control plane comes back up holding ports somebody else
        wanted - so it is asked for, once, per group. Idempotent: a group that
        already has one is told which, rather than being given a second and
        abandoning the first while clients are pointed at it.
      responses:
        '200':
          description: The group's socket
          content:
            application/json:
              schema:
                type: object
                required: [servingPort, allocated]
                properties:
                  servingPort: { type: integer }
                  allocated:
                    type: boolean
                    description: False when the group already had one.
        '409':
          description: >
            The range is full, or the port could not be bound. Either way the
            group is left without one rather than recorded at a socket that is
            not answering.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/pools/{poolId}/agent:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [admin]
      summary: Who owns the binary on this pool, and which version it should run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [managed, external]
                  description: >
                    external never pushes. It records what is expected and
                    reports what is seen, which is what makes this safe beside
                    an MDM or somebody installing by hand.
                version: { type: string, nullable: true }
      responses:
        '204': { description: Set }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/logs:
    get:
      tags: [admin]
      summary: Machine activity and fleet actions, together
      description: >
        Two logs answering different questions, read as one: what a machine has
        been doing, and who told the fleet to do something. The text and html
        formats are exports - something to grep, attach to a ticket, or send to
        somebody with no login here - and are returned as attachments.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Matches the machine, the actor, the event and the detail payload.
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: source
          in: query
          schema: { type: string, enum: [node, fleet] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: format
          in: query
          schema: { type: string, enum: [json, text, html] }
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [at, source, event]
                  properties:
                    at: { type: string, format: date-time }
                    source: { type: string, enum: [node, fleet] }
                    node: { type: string, nullable: true }
                    actor: { type: string, nullable: true }
                    event: { type: string }
                    detail: { type: object, additionalProperties: true }
            text/plain:
              schema: { type: string }
            text/html:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/models:
    get:
      tags: [admin]
      summary: The model catalogue
      responses:
        '200':
          description: Models, with how many nodes hold each
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Model' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Register a model and the hashes of its files
      description: >
        Registers what the weights are and what they should hash to. Import is
        deliberately explicit: nothing reaches the catalogue by being discovered
        on a node, because a model nobody chose is exactly what a fleet must not
        distribute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelRequest' }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A model with this id is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/models/{modelId}/shape:
    parameters:
      - name: modelId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: How many machines a model runs across
      description: >
        Declared rather than derived: whether a 40GB model runs on one machine
        or two is a decision about the fleet, not a property of the weights.


        409 when no group could run it. A model needing more machines than the
        fleet has anywhere is not a plan, it is a request refused at every
        dispatch, and finding that out now is the point of declaring shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                machines: { type: integer, minimum: 1 }
                minMemoryGb: { type: number, nullable: true }
      responses:
        '200':
          description: The shape, and which groups could run it
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  machines: { type: integer }
                  perMachineGb: { type: number }
                  runnableIn: { type: array, items: { type: object, additionalProperties: true } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No group can run it at that shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/models/verify:
    get:
      tags: [admin]
      summary: Whether the repository still holds what the catalogue promises
      description: >
        The catalogue records what a model is; the repository holds the bytes.
        They can disagree, and when they did nothing noticed: a model this fleet
        was serving had eleven files and 18.4GB recorded and no directory at all.
        The nodes had fetched their copies earlier, so the only symptom would
        have been a new machine failing to fetch it, months later.


        Cheap by default. `deep=1` hashes every byte, which catches corruption
        rather than absence and takes minutes for a large model.
      parameters:
        - name: deep
          in: query
          required: false
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: One report per registered model
          content:
            application/json:
              schema:
                type: object
                required: [root, deep, models, healthy, broken, bytesMissing, reports]
                properties:
                  root: { type: string }
                  deep: { type: boolean }
                  models: { type: integer }
                  healthy: { type: integer }
                  broken: { type: integer }
                  bytesMissing: { type: integer }
                  reports:
                    type: array
                    items:
                      type: object
                      required: [modelId, ok, files, present, bytesMissing, faults]
                      properties:
                        modelId: { type: string }
                        ok: { type: boolean }
                        files: { type: integer }
                        present: { type: integer }
                        bytesMissing: { type: integer }
                        faults:
                          type: array
                          items:
                            type: object
                            required: [path, fault]
                            properties:
                              path: { type: string }
                              fault:
                                type: string
                                enum: [missing, wrong-size, wrong-hash, unsafe-path]
                              expected: {}
                              actual: {}
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/models/{modelId}:
    parameters:
      - name: modelId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      summary: One model, its files, and where it actually is
      responses:
        '200':
          description: Model with placement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [admin]
      summary: Remove a model from the catalogue
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/pools/{poolId}/models/{modelId}:
    parameters:
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: modelId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin]
      summary: Assign a model to a pool
      description: >
        Declares that every node in this pool should hold these weights. It does
        not move bytes; nodes reconcile toward it on their own schedule, which
        is what makes the declaration survive a machine being asleep.
      responses:
        '204': { description: Assigned }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [admin]
      summary: Unassign a model from a pool
      responses:
        '204': { description: Unassigned }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/blobs/{sha256}:
    put:
      tags: [admin]
      summary: Upload one piece of a job's content, named by its own hash
      description: |
        Content-addressed, so a resubmission after a lighting tweak uploads the
        file that changed rather than the bundle, and two jobs sharing a texture
        library store it once. The bytes are hashed on arrival and refused if
        they do not match the name they were sent under: accepting them would
        put the wrong content under a name some job is about to fetch, and every
        machine would render it without complaint.

        Nothing uploaded here is kept once the jobs referencing it have
        finished.
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [sha256, sizeBytes]
                properties:
                  sha256: { type: string }
                  sizeBytes: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/blobs/missing:
    post:
      tags: [admin]
      summary: Which of these the fleet does not already hold
      description: |
        Asked before uploading, so a submitter sends only what is new. This is
        what makes resubmitting a shot cheap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256s]
              properties:
                sha256s:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: The ones to send
          content:
            application/json:
              schema:
                type: object
                required: [missing]
                properties:
                  missing:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/jobs/openjd:
    post:
      tags: [admin]
      summary: Submit an Open Job Description job template
      description: |
        OpenJD is the open specification for portable render jobs, so a studio's
        existing submitter can point at this fleet without knowing what it is.
        The parameter space, range expressions, job parameters and their data
        flow are the specification as written.

        **One deliberate departure.** OpenJD describes a step's work as
        `script.actions.onRun.command` with `args` - an executable and its
        arguments - which is correct for a farm you own. These machines belong
        to the people sitting at them, borrowed on the promise that the agent
        does what it says and nothing else. Running a command from a submission
        would make "submit a job" mean "run this binary on fifty of your
        colleagues' workstations".

        So `command` is resolved to an adapter this fleet has, and never
        executed. A template naming something with no adapter is refused here,
        once, rather than accepted and failed on every machine in turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [poolId, template]
              properties:
                poolId: { type: string, format: uuid }
                template:
                  type: object
                  description: An OpenJD job template, `jobtemplate-2023-09`.
                  additionalProperties: true
                parameterValues:
                  type: object
                  description: Values for the template's job parameters.
                  additionalProperties: true
                attachments:
                  type: array
                  description: |
                    Where each uploaded blob goes inside the job's working set.
                    Paths are relative and constrained: the submitter's own
                    paths mean nothing on the machine that will render.
                  items:
                    type: object
                    required: [path, sha256]
                    properties:
                      path: { type: string }
                      sha256: { type: string }
                      dataFlow: { type: string, enum: [IN, OUT, INOUT] }
                entryPath:
                  type: string
                  description: |
                    Which attachment the adapter opens. Worked out from the
                    attachments when exactly one is a scene; required when there
                    is any doubt, because two machines guessing differently
                    would render two different scenes under one job.
                source: { type: string }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/scenes:
    get:
      tags: [admin]
      summary: Scenes the fleet can render
      responses:
        '200':
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenes:
                    type: array
                    items: { $ref: '#/components/schemas/Scene' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Register a directory in the scene repository as a scene
      description: |
        Catalogued where it already sits rather than copied. Scenes are large
        and short-lived, and copying a 40GB bundle to register it costs 40GB of
        disk and several minutes before a job can even be submitted.

        Re-registering the same id re-walks the directory, which is how a scene
        that gained or lost a file is corrected. Files are replaced wholesale, so
        a catalogue that only ever grew cannot send nodes after a file that is no
        longer part of the scene.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: |
                    Also the directory name under the scene repository root, so
                    it is constrained to the same allow-list as a model id.
                entry:
                  type: string
                  nullable: true
                  description: |
                    The file the renderer opens. Worked out automatically when
                    the bundle holds exactly one .blend; required when it holds
                    several, because the right answer is for a person to say
                    which, not for two machines to guess differently and render
                    two different scenes under one name.
                frameStart: { type: integer, nullable: true }
                frameEnd: { type: integer, nullable: true }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scene' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/v1/jobs/{jobId}/outputs:
    get:
      tags: [admin]
      summary: Frames this job has produced
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: What has come back so far
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputs:
                    type: array
                    items:
                      type: object
                      required: [name, sizeBytes, sha256]
                      properties:
                        name: { type: string }
                        sizeBytes: { type: integer, format: int64 }
                        sha256: { type: string }
                        renderedBy: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/jobs/{jobId}/outputs/{name}:
    get:
      tags: [admin]
      summary: Download one frame
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The frame
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/v1/jobs:
    get:
      tags: [admin]
      summary: Recent jobs, with what they are and where they came from
      responses:
        '200':
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Submit a job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400':
          description: |
            The submission does not describe work that can be done: a render job
            naming no scene, or a frame range the scene does not cover. Refused
            here rather than at the node, because a frame past the end of a
            scene renders black, lands as a real file, and looks like a
            successful job until somebody plays it back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/jobs/{jobId}/results:
    get:
      tags: [admin]
      summary: Completed results, in submission order
      description: |
        Paged by `position` rather than an offset, because requeued remainders
        slot in ahead of pending work and an offset would drift under them.
        `nextAfter` is null when the last page has been served.
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
        - { name: after, in: query, schema: { type: integer } }
      responses:
        '200':
          description: A page of completed units
          content:
            application/json:
              schema:
                type: object
                required: [jobId, state, units]
                properties:
                  jobId: { type: string, format: uuid }
                  state: { type: string }
                  nextAfter: { type: integer, nullable: true }
                  units:
                    type: array
                    items:
                      type: object
                      properties:
                        unitId: { type: string, format: uuid }
                        position: { type: integer }
                        node: { type: string, nullable: true }
                        seconds: { type: number, nullable: true }
                        items: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/v1/jobs/{jobId}:
    get:
      tags: [admin]
      summary: Job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    mtls:
      type: mutualTLS
      description: Node client certificate, issued at enrollment approval
    session:
      type: apiKey
      in: header
      name: authorization
      description: Human session token

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted for this pool
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    WorkKind:
      type: string
      description: |
        embed runs on the ANE and is permitted in every presence state.
        generate and render are GPU work, permitted only in LOCKED and ABSENT.
      enum: [embed, generate, render]

    PresenceState:
      type: string
      enum: [ACTIVE, PASSIVE, IDLE, LOCKED, ABSENT]

    EnrollRequest:
      type: object
      required: [joinToken, hostname, chip, memoryGb, metalWorkingSetGb, osVersion, csrPem]
      description: |
        `machineId` is the hardware's IOPlatformUUID. Approving a node retires
        any earlier record for the same machine, so a reinstalled machine
        replaces its old entry rather than appearing twice.
      properties:
        joinToken: { type: string }
        hostname: { type: string }
        chip: { type: string, example: Apple M2 Max }
        memoryGb: { type: number }
        metalWorkingSetGb:
          type: number
          description: |
            Metal self-caps well below installed RAM (~81% on an M2 Max).
            Ceilings are fractions of this, never of installed memory.
        osVersion: { type: string }
        machineId: { type: string, nullable: true }
        csrPem:
          type: string
          description: |
            CSR for a keypair generated on-device in the Secure Enclave and
            marked non-exportable, so a copied certificate is useless without
            the hardware. Stored, not signed: signing happens at approval, so a
            leaked join token is a nuisance rather than a fleet compromise.

    EnrollResponse:
      type: object
      required: [nodeId, state, enrollmentToken]
      properties:
        nodeId: { type: string, format: uuid }
        state: { type: string, enum: [pending] }
        enrollmentToken:
          type: string
          description: |
            Single use. The only way back in before the node has an identity,
            so it is cleared once the certificate is collected.

    Heartbeat:
      type: object
      required: [presenceState]
      properties:
        agentVersion:
          type: string
          description: What this binary calls itself, set at build time.
        agentFingerprint:
          type: string
          description: >
            sha256 of the running executable. A version string is a claim; this
            is evidence, and it is what proves the binary on disk is the one the
            control plane believes it deployed.
        pipelineAddress:
          type: string
          nullable: true
          description: >
            Where a peer should dial this machine for pipeline traffic, declared
            by the node rather than observed from its connection. A split runs
            over whatever link the machines share, and that is deliberately not
            always the one they use to reach the control plane.
            Null means the node has no such address at the moment - the link is
            down or unconfigured - and clears the one on record. Omitting the
            field leaves it unchanged, which is what an agent that predates it
            does.
        syncFaults:
          type: object
          additionalProperties: { type: string }
          description: >
            Model id -> why this node does not hold it, from the last
            reconciliation pass. The key `*` means the pass could not run at
            all, which is a different fault from any single model failing and
            the one that went unnoticed here for twelve hours.


            Absent means no pass has finished since the last beat and says
            nothing; an empty object means a pass ran cleanly, and is what
            clears a fault an operator has already seen.
        storedModels:
          type: object
          additionalProperties: { type: number }
          description: |
            Model ids this node has on disk, mapped to gigabytes. Distinct from
            residentModels, which is what is loaded into memory this second and
            is empty on a healthy machine that nobody has asked anything of yet.
            Possession is what the catalogue reconciles against; residency is
            what the router uses to avoid a cold load.
        models:
          type: array
          description: |
            What each model this node can serve accepts. Reported rather than
            configured centrally, so the advertised window cannot drift from the
            weights actually on disk.
          items:
            type: object
            required: [name, contextLength]
            properties:
              name: { type: string }
              contextLength: { type: integer }
        userPaused:
          type: boolean
          description: |
            The machine owner has paused this node locally. Reported, not
            requested: the control plane records it and refuses to dispatch
            work, and has no way to clear it. Only the person at the machine
            can.
        presenceState: { $ref: '#/components/schemas/PresenceState' }
        onAcPower: { type: boolean }
        thermalOk: { type: boolean }
        residentModels:
          type: object
          additionalProperties: { type: number }
          description: |
            Model hashes currently held in memory, hash -> resident GB. Routing
            prefers a node that already has the model: E4 puts load at 1-3s and
            paying that per request is the difference between a service and a
            curiosity.
        capabilitySamples:
          type: array
          description: |
            Throughput observed from completed work, never declared. Capability
            is workload-dependent: the same two machines differed 7.5% on a 1.5B
            model and 26.3% on a 7B, so this is a map per workload class rather
            than a scalar.
          items:
            type: object
            required: [workloadClass, itemsPerSecond]
            properties:
              workloadClass: { type: string }
              itemsPerSecond: { type: number }

    WorkLease:
      type: object
      required: [unitId, kind, items, leaseExpiresAt]
      properties:
        jobLabel: { type: string, nullable: true }
        jobSource: { type: string }
        unitId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash:
          type: string
          nullable: true
          description: |
            Content hash from the signed catalogue. A work unit carries data and
            references a model; it cannot name an interpreter, a path, or a
            command. That bounds the blast radius of a compromised control plane.
        jobId:
          type: string
          format: uuid
          description: |
            Which job this unit belongs to, so a node can ask what content the
            job needs and, when the job ends, know what it may delete.
        sceneId:
          type: string
          nullable: true
          description: |
            The scene a render unit belongs to, from the job rather than from
            the unit. The same rule as modelHash, and rendering is where it
            would be easiest to break: a render job is naturally described as
            "run this file", and a fleet that accepted that description is one
            where submitting a job means executing code on fifty machines.
        items:
          type: array
          items: { type: object, additionalProperties: true }
        leaseExpiresAt: { type: string, format: date-time }

    NoWork:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [empty, none-of-these-kinds, node-paused, user-paused, no-pool,
                 holding-a-split]
          description: |
            `node-paused` is administrative and an operator can lift it.
            `user-paused` is the machine owner's own pause and nobody else can.
            `holding-a-split` is neither: this machine's cluster group serves a
            model that runs across several machines, so it is not available to
            its harvest group for as long as it does. A gang cannot be
            preempted, and harvest membership is the promise that a machine can
            be taken away. It returns on its own when the group stops serving
            that model - there is nothing for an operator to lift, and it is
            reported separately so that nobody goes looking at membership for an
            explanation that is not there.

    WorkResult:
      type: object
      required: [completed, seconds]
      properties:
        completed:
          type: array
          items: { type: object, additionalProperties: true }
        unfinished:
          type: array
          description: Items the agent did not reach; requeued at the head.
          items: { type: object, additionalProperties: true }
        seconds: { type: number }
        failed: { type: boolean, default: false }

    Scene:
      type: object
      required: [id, entry, sizeBytes]
      properties:
        id: { type: string }
        entry: { type: string }
        sizeBytes: { type: integer, format: int64 }
        frameStart: { type: integer, nullable: true }
        frameEnd: { type: integer, nullable: true }
        renderer: { type: string, enum: [blender] }
        files:
          type: array
          items:
            type: object
            required: [path, sizeBytes, sha256]
            properties:
              path: { type: string }
              sizeBytes: { type: integer, format: int64 }
              sha256: { type: string }
    Node:
      type: object
      required: [id, hostname, tier, state]
      properties:
        syncFaults:
          type: object
          additionalProperties: { type: string }
          description: >
            Why this machine is not holding what it was assigned, as it last
            reported. Empty on a healthy node.
        pipelineAddress:
          type: string
          nullable: true
          description: Where a peer dials this machine for a split.
        suspended:
          type: object
          nullable: true
          description: >
            Why this machine is not available to harvest, when it is not. A
            machine whose cluster group serves a model that runs across several
            machines is held out of its harvest group for as long as it does:
            a gang cannot be preempted, and harvest membership is the promise
            that a machine can be taken away. Null for every machine that is
            available, which is nearly all of them. It clears itself when the
            group stops serving that model - there is nothing to lift.
          properties:
            modelId: { type: string }
            machines:
              type: integer
              description: How many machines that model runs across.
            by:
              type: string
              description: The cluster group serving it.
            from:
              type: array
              items: { type: string }
              description: The harvest groups that have lost this machine.
        agentVersion:
          type: string
          nullable: true
          description: What the running binary calls itself. A claim, not evidence.
        agentFingerprint:
          type: string
          nullable: true
          description: >
            sha256 of the running executable, which is the only evidence of what
            is actually deployed. A version string survives a binary being
            replaced by hand; this does not.
        lastModelSync:
          type: string
          format: date-time
          nullable: true
          description: When this node last finished a reconciliation pass.
        id: { type: string, format: uuid }
        hostname: { type: string }
        chip: { type: string }
        memoryGb: { type: number }
        metalWorkingSetGb: { type: number }
        tier:
          type: string
          enum: [harvest, cluster]
          description: |
            Derived from `tiers`: cluster when the machine is offered for
            cluster work at all. Kept because the scheduler, the router and the
            agent all ask the same single question of it.
        tiers:
          type: array
          items: { type: string, enum: [harvest, cluster] }
          description: |
            What the machine is offered for. A machine may be in both, which
            means an interactive request can land on it while its owner is
            using it.
        state:
          type: string
          enum: [pending, active, cordoned, paused, offline, superseded]
          description: |
            `superseded` means this record was replaced when the same physical
            machine enrolled again. Kept rather than deleted, because the
            certificate it holds was really issued.
        ownerUserId: { type: string, format: uuid, nullable: true }
        presenceState:
          # Null until the node's first heartbeat. A freshly enrolled node has
          # no presence yet, which is precisely the state the enrollment flow
          # produces.
          oneOf:
            - $ref: '#/components/schemas/PresenceState'
            - type: 'null'
        lastHeartbeat: { type: string, format: date-time, nullable: true }
        models:
          type: array
          description: |
            Model names this node can serve, for the fleet view. A heartbeat
            carries the same name with its context window; here only the names
            are needed.
          items: { type: string }
        residentModels:
          type: array
          items: { type: string }
        serving:
          type: boolean
          description: |
            Holding the reverse channel open, so it could answer now. Distinct
            from being healthy: a node reading a large prompt is neither idle
            nor gone, and reporting it as unavailable sends people looking for a
            crash.
        inFlight: { type: integer }
        userPaused:
          type: boolean
          description: |
            Paused by the person at the machine. Distinct from state=paused,
            which is administrative: this one no role can lift.
        userPausedAt: { type: string, format: date-time, nullable: true }
        capabilityProfiles:
          type: object
          additionalProperties: { type: number }

    Pool:
      type: object
      required: [id, name, tier, schedule, preempt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tier: { type: string, enum: [harvest, cluster] }
        schedule: { type: string, enum: [independent-units, gang] }
        preempt: { type: string, enum: [on-user-activity, never] }
        priority: { type: integer }
        agentChannel: { type: string, enum: [managed, external] }
        desiredAgentVersion: { type: string, nullable: true }
        servingModelId:
          type: string
          nullable: true
          description: >
            What this group's machines run, as against what they hold. Null
            means nobody has said, which is not the same as none.
        servingPort:
          type: integer
          nullable: true
          description: >
            The socket this group answers on, allocated when it was created and
            bound for as long as it exists. Pointing an application at this port
            addresses this group's machines and no others - nothing in the
            request names a group, so nothing in it can name the wrong one.
            Null for a group created before groups had sockets, which is
            reachable on the shared serving port only.

    Model:
      type: object
      required: [id, runtime, kind, sizeBytes, fileCount, assignedPools, nodesHolding]
      properties:
        machines:
          type: integer
          minimum: 1
          description: >
            Machines this model runs across, its layers divided between them.
            Declared rather than derived: whether a 40GB model runs on one
            machine or two is a decision about the fleet, not a property of the
            weights.
        minMemoryGb:
          type: number
          nullable: true
          description: >
            What each of those machines must be able to load. Null means derive
            it from the size, which is what dividing the layers does.
        id: { type: string }
        runtime: { type: string, enum: [mlx, coreml] }
        kind: { $ref: '#/components/schemas/WorkKind' }
        sizeBytes: { type: integer, format: int64 }
        contextLength: { type: integer, nullable: true }
        quantization: { type: string, nullable: true }
        family: { type: string, nullable: true }
        fileCount: { type: integer }
        importedAt: { type: string, format: date-time }
        assignedPools:
          type: array
          items: { type: string, format: uuid }
        nodesHolding:
          type: integer
          description: Nodes reporting these weights resident right now.
        nodesWanting:
          type: integer
          description: >
            Nodes in an assigned pool that do not hold it yet. The gap between
            this and nodesHolding is the only number worth watching.

    ModelFile:
      type: object
      required: [path, sizeBytes, sha256]
      properties:
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    ModelRequest:
      type: object
      required: [id, runtime, kind, files]
      properties:
        id: { type: string, minLength: 1 }
        runtime: { type: string, enum: [mlx, coreml] }
        kind: { $ref: '#/components/schemas/WorkKind' }
        contextLength: { type: integer, nullable: true }
        quantization: { type: string, nullable: true }
        family: { type: string, nullable: true }
        files:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ModelFile' }

    ModelDetail:
      allOf:
        - $ref: '#/components/schemas/Model'
        - type: object
          required: [files, placement]
          properties:
            files:
              type: array
              items: { $ref: '#/components/schemas/ModelFile' }
            runnableIn:
              type: array
              description: >
                Which groups could actually run this model. Holding is a
                property of a machine; running is a property of a group -
                enough machines, each big enough, each holding the weights.


                `pending` and `blocked` are separated deliberately: a group
                still fetching needs only time, and one whose machines are too
                small never will. A single "no" sends somebody to wait for what
                is not coming, or to reassign what was about to work.
              items:
                type: object
                required: [groupId, name, tier, machines, state]
                properties:
                  groupId: { type: string, format: uuid }
                  name: { type: string }
                  tier: { type: string, enum: [harvest, cluster] }
                  machines: { type: integer }
                  state: { type: string, enum: [ready, pending, blocked] }
                  detail: { type: string, nullable: true }
            history:
              type: array
              description: >
                What has been done to this model and by whom. The assignment row
                alone cannot answer that: it is mutable, so unassigning erased
                any record of having assigned it.
              items:
                type: object
                required: [at, action]
                properties:
                  at: { type: string, format: date-time }
                  action: { type: string }
                  by: { type: string, nullable: true }
                  detail: { type: object, additionalProperties: true }
            placement:
              type: array
              description: Desired against actual, per node.
              items:
                type: object
                required: [nodeId, hostname, wanted, held]
                properties:
                  nodeId: { type: string, format: uuid }
                  hostname: { type: string }
                  wanted: { type: boolean }
                  held:
                    type: boolean
                    description: The weights are on this node's disk.
                  loaded:
                    type: boolean
                    description: >
                      Loaded into memory right now. Distinct from held, and much
                      more volatile: a healthy machine nobody has asked anything
                      of holds every model it was given and has none loaded.

    JobRequest:
      type: object
      required: [poolId, kind]
      properties:
        poolId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash: { type: string, nullable: true }
        batchSize:
          type: integer
          minimum: 1
          description: |
            Items per unit. Defaults to 8, and to 1 for render: a unit is the
            granularity at which work is thrown away when somebody sits down at
            the machine, and one frame is already minutes.
        sceneId:
          type: string
          nullable: true
          description: |
            Required for render. The frames are derived from the range below
            rather than supplied as items, so every node agrees about what frame
            12 means and no unit has to be trusted to say.
        frameStart: { type: integer, nullable: true }
        frameEnd: { type: integer, nullable: true }
        frameStep: { type: integer, minimum: 1, nullable: true }
        samples:
          type: integer
          nullable: true
          description: |
            Overrides what the scene asks for. Omitted by default, because
            substituting a number would silently render somebody's final frame
            at preview quality.
        label:
          type: string
          description: |
            What this work is, in words, for whoever sees it running. A fleet
            view that can say a machine is busy but not what with is not much of
            an answer to the person whose machine it is.
        source:
          type: string
          default: api
          description: |
            Where the work came from - `api`, `cli`, `test-harness`, `demo-seed`.
            Claimed by the submitter, unlike the recorded submitter identity,
            which comes from the authenticated session. It distinguishes honest
            traffic sources; it is not evidence against a dishonest one.

            Synthetic work must say so. Otherwise every capacity figure it
            produces is quietly overstated by somebody else's load test.
        items:
          type: array
          minItems: 1
          items: { type: object, additionalProperties: true }

    Job:
      type: object
      required: [id, poolId, kind, state, counts]
      properties:
        id: { type: string, format: uuid }
        poolId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        label: { type: string, nullable: true }
        source: { type: string }
        submittedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [pending, running, complete, failed] }
        counts:
          type: object
          properties:
            pending: { type: integer }
            leased: { type: integer }
            done: { type: integer }
            failed: { type: integer }

    FleetSummary:
      type: object
      required: [nodes, eligibleForGpu, gpuCapacityGb, aneCapacityGb, series, queues]
      properties:
        nodes: { type: integer }
        windowSeconds: { type: integer }
        bucketSeconds: { type: integer }
        pendingNodes:
          type: integer
          description: >
            Machines that enrolled and have not been approved. They do nothing
            at all until somebody acts, and nothing else on the fleet view hints
            that they exist.
        eligibleForGpu: { type: integer }
        gpuCapacityGb: { type: number }
        aneCapacityGb: { type: number }
        series:
          type: array
          items:
            type: object
            required: [hour, gpuGb, aneGb]
            properties:
              hour: { type: string, format: date-time }
              gpuGb: { type: number }
              aneGb: { type: number }
        queues:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              state: { type: string }
              n: { type: integer }

    NodeDetail:
      type: object
      required: [id, hostname, state, headroomGb, idlePattern, yields7d, activity]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        chip: { type: string, nullable: true }
        memoryGb: { type: number, nullable: true }
        metalWorkingSetGb: { type: number, nullable: true }
        tier: { type: string }
        state: { type: string }
        ownerUserId: { type: string, nullable: true }
        presenceState: { type: string, nullable: true }
        onAcPower: { type: boolean, nullable: true }
        thermalOk: { type: boolean, nullable: true }
        lastHeartbeat: { type: string, nullable: true }
        capabilityProfiles: { type: object, additionalProperties: { type: number } }
        allowedCidrs: { type: string, nullable: true }
        headroomGb:
          type: number
          description: What is takeable right now under policy, not total memory.
        policy:
          nullable: true
          type: object
          additionalProperties: true
        idlePattern:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer }
              presence_state: { type: string }
              n: { type: integer }
        yields7d:
          type: integer
          description: |
            How often this node interrupted work in the last week. The early
            warning that a policy is too aggressive for this machine.
        activity:
          type: array
          items:
            type: object
            properties:
              at: { type: string }
              event: { type: string }
              detail: { type: object, additionalProperties: true }

    Dispatch:
      type: object
      required: [dispatchId, kind, body]
      properties:
        dispatchId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WorkKind' }
        modelHash: { type: string, nullable: true }
        body:
          type: object
          additionalProperties: true
          description: The request to run, already capped by the node's policy.

    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }

    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
        dai:
          type: object
          description: |
            Outside the OpenAI schema. A caller on a harvested fleet should be
            able to see which machine answered and whether policy shortened the
            request.
          properties:
            node: { type: string }
            presenceState: { type: string, nullable: true }
            seconds: { type: number }
            maxTokensApplied: { type: integer }
            cappedByPolicy: { type: boolean }
            split:
              $ref: '#/components/schemas/SplitReport'

    SplitReport:
      type: object
      description: |
        Evidence that this completion was served by more than one machine.

        Present only when the model was divided; absent entirely on an ordinary
        completion, so a caller writing `if (dai.split)` reads both correctly
        without every single-machine answer carrying a field denying it.

        Distinct from the `dai` block on /v1/models, which reports what an
        operator declared. A declaration can be wrong - this fleet ran for a day
        with a group declaring it served a 14B while its machines held a 32B and
        a 30B. This names the machines the request was actually dispatched to,
        and a machine cannot appear here without having been sent the work.
      required: [machines, ranks, layersReported]
      properties:
        machines:
          type: integer
          description: How many machines served this one request.
        layersReported:
          type: boolean
          description: |
            Whether the layer ranges below are present. Stated rather than left
            to be inferred from a missing field: an agent older than the release
            that began reporting them cannot say, which is worth telling apart
            from a split that did not happen.
        ranks:
          type: array
          items:
            type: object
            required: [hostname, rank, role]
            properties:
              hostname: { type: string }
              rank:
                type: integer
                description: |
                  Numbered in reverse. Rank 0 holds the last layers and the
                  output head, and is the machine that answers.
              role:
                type: string
                enum: ['output head', 'feeds the next rank']
              layers:
                type: array
                description: |
                  `[start, end)` of the layers this machine held. The part that
                  proves division actually happened - two hostnames prove two
                  machines were sent work, where 0..<24 beside 24..<48 proves
                  neither held the whole model.
                minItems: 2
                maxItems: 2
                items: { type: integer }

    Policy:
      type: object
      description: |
        Per presence state. Values are E2 measurements, not estimates.
        mem_frac is NOT a politeness dial: a 32 GB load disturbed a viewport
        less than an 8 GB one at identical duty. Footprint governs what fits,
        occupancy governs disturbance.
      additionalProperties:
        type: object
        required: [gpu, ane, qos, dutyMax, memFrac]
        properties:
          gpu: { type: boolean }
          ane: { type: boolean }
          qos: { type: string, enum: [background, standard] }
          dutyMax: { type: number, minimum: 0, maximum: 1 }
          memFrac: { type: number, minimum: 0, maximum: 1 }
          maxCompletionTokens:
            type: integer
            description: |
              Largest single completion this state permits. Bounds how long a
              returning user waits, since one request has no seam to yield at.

security:
  - mtls: []
  - session: []
